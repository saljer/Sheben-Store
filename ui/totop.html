<!-- Кнопка «наверх»: появляется, когда страницу пролистали больше чем на два экрана (лента, «Главная», каталог) -->
<style>
.totop{position:fixed;right:22px;bottom:22px;z-index:60;width:46px;height:46px;border-radius:50%;cursor:pointer;
 border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--bg) 72%,transparent);
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--accent);font:600 20px/1 system-ui,sans-serif;
 box-shadow:0 8px 24px rgb(0 0 0/.28);opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;
 transition:opacity .25s,transform .25s,background .2s,color .2s}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop:hover{background:var(--accent);color:var(--bg)}
@media (prefers-reduced-motion:reduce){.totop{transition:none}}
</style>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const b=document.createElement("button");
 b.className="totop";b.title="Наверх";b.setAttribute("aria-label","Наверх");b.textContent="↑";
 document.body.appendChild(b);
 const f=()=>b.classList.toggle("show",scrollY>2*innerHeight);
 addEventListener("scroll",f,{passive:true});addEventListener("resize",f);f();
 b.onclick=()=>scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
});
</script>
